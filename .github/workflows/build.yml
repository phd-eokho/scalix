name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-check:
    name: Lint & Formatting (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build-linux:
    name: Build & Package (Linux x86_64)
    needs: [lint-check]
    runs-on: ubuntu-24.04
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json:/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json:/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Mesa Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            vulkan-tools \
            mesa-vulkan-drivers \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libgbm-dev \
            libdrm-dev \
            mesa-utils \
            libjpeg-dev \
            g++ \
            pkg-config

      - name: Verify Mesa Software Vulkan (Lavapipe)
        run: |
          echo "=== Vulkan Driver Info ==="
          ls -la /usr/share/vulkan/icd.d/ || true
          vulkaninfo --summary || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests (Mesa Lavapipe)
        run: cargo test --workspace --all-targets --verbose

      - name: Run doc-tests
        run: cargo test --workspace --doc --verbose

      - name: Build Release Binaries and Libraries
        run: cargo build --release

      - name: Package Release Distribution
        run: |
          DIST_DIR=$(mktemp -d)
          echo "DIST_DIR=${DIST_DIR}" >> "$GITHUB_ENV"
          PKG_NAME="${{ github.ref_name }}"
          PKG_NAME="${PKG_NAME//\//-}"
          [ -z "$PKG_NAME" ] && PKG_NAME="${{ github.sha }}"
          STAGE_DIR="${DIST_DIR}/scalix-${PKG_NAME}-linux-x86_64"
          mkdir -p "${STAGE_DIR}/lib" "${STAGE_DIR}/include"

          cp target/release/libscalix.so "${STAGE_DIR}/lib/"
          cp target/release/libscalix.a "${STAGE_DIR}/lib/"
          cp -r include/* "${STAGE_DIR}/include/"
          [ -f README.md ] && cp README.md "${STAGE_DIR}/"
          [ -f README.ko.md ] && cp README.ko.md "${STAGE_DIR}/"
          [ -f LICENSE ] && cp LICENSE "${STAGE_DIR}/"

          tar -czvf "${DIST_DIR}/scalix-${PKG_NAME}-linux-x86_64.tar.gz" -C "${DIST_DIR}" "scalix-${PKG_NAME}-linux-x86_64"
          tar --zstd -cvf "${DIST_DIR}/scalix-${PKG_NAME}-linux-x86_64.tar.zst" -C "${DIST_DIR}" "scalix-${PKG_NAME}-linux-x86_64"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            ${{ env.DIST_DIR }}/*.tar.gz
            ${{ env.DIST_DIR }}/*.tar.zst
          if-no-files-found: error

  benchmark-linux:
    name: Performance Benchmark (Linux x86_64)
    needs: [build-linux]
    runs-on: ubuntu-24.04
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json:/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json:/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            vulkan-tools \
            mesa-vulkan-drivers \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libgbm-dev \
            libdrm-dev \
            mesa-utils \
            libjpeg-dev \
            libopencv-dev \
            g++ \
            pkg-config

      - name: Verify Mesa Software Vulkan (Lavapipe)
        run: |
          echo "=== Vulkan Driver Info ==="
          ls -la /usr/share/vulkan/icd.d/ || true
          vulkaninfo --summary || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run C++ Performance Benchmark
        run: make -C examples benchmark

  build-android:
    name: Build & Package (${{ matrix.arch_name }})
    needs: [lint-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch_name: android-aarch64
          - target: armv7-linux-androideabi
            arch_name: android-armv7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK (r27c)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cache cargo-ndk Binary
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Cross-compile Android Libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk --target ${{ matrix.target }} --platform 26 build --release -p scalix-capi

      - name: Package Android Distribution
        run: |
          DIST_DIR=$(mktemp -d)
          echo "DIST_DIR=${DIST_DIR}" >> "$GITHUB_ENV"
          PKG_NAME="${{ github.ref_name }}"
          PKG_NAME="${PKG_NAME//\//-}"
          [ -z "$PKG_NAME" ] && PKG_NAME="${{ github.sha }}"
          STAGE_DIR="${DIST_DIR}/scalix-${PKG_NAME}-${{ matrix.arch_name }}"
          mkdir -p "${STAGE_DIR}/lib" "${STAGE_DIR}/include"

          cp target/${{ matrix.target }}/release/libscalix.so "${STAGE_DIR}/lib/"
          cp target/${{ matrix.target }}/release/libscalix.a "${STAGE_DIR}/lib/"
          cp -r include/* "${STAGE_DIR}/include/"
          [ -f README.md ] && cp README.md "${STAGE_DIR}/"
          [ -f README.ko.md ] && cp README.ko.md "${STAGE_DIR}/"
          [ -f LICENSE ] && cp LICENSE "${STAGE_DIR}/"

          tar -czvf "${DIST_DIR}/scalix-${PKG_NAME}-${{ matrix.arch_name }}.tar.gz" -C "${DIST_DIR}" "scalix-${PKG_NAME}-${{ matrix.arch_name }}"
          tar --zstd -cvf "${DIST_DIR}/scalix-${PKG_NAME}-${{ matrix.arch_name }}.tar.zst" -C "${DIST_DIR}" "scalix-${PKG_NAME}-${{ matrix.arch_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch_name }}
          path: |
            ${{ env.DIST_DIR }}/*.tar.gz
            ${{ env.DIST_DIR }}/*.tar.zst
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, benchmark-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Stage Release Assets
        run: |
          mkdir -p release-assets
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.tar.zst" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: true
