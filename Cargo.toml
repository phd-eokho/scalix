[workspace]
resolver = "2"
members = [
    "crates/scalix-core",
    "crates/scalix-capi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["deokho <duty@live.co.kr>"]
repository = "https://github.com/phd-eokho/scalix"
description = "Extensible hardware-accelerated image scaling and resampling engine"

[workspace.dependencies]
thiserror = "1.0"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
ash = "0.38"



[profile.release]
# Cross-crate inlining into libscalix.so/.a. panic stays "unwind": the C ABI relies on catch_unwind.
lto = "thin"
codegen-units = 1
